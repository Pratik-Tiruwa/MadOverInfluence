    <script>
      window.MIN_LOADER_DONE = false;
      window.ON_MIN_LOADER_DONE = null;

      (function(){
        var p = document.querySelector('.static-percent');
        var f = document.querySelector('.static-progress-fill');
        var steps = [0, 25, 50, 75, 100];
        var i = 0;
        
        function nextStep() {
          if (i < steps.length) {
            var v = steps[i];
            if (p) p.innerHTML = v + '<span>%</span>';
            if (f) f.style.width = v + '%';
            i++;
            
            if (v === 100) {
              setTimeout(function() {
                window.MIN_LOADER_DONE = true;
                if (window.ON_MIN_LOADER_DONE) window.ON_MIN_LOADER_DONE();
              }, 300);
            } else {
              setTimeout(nextStep, 500); // 500ms per step
            }
          }
        }
        setTimeout(nextStep, 100);
      })();
