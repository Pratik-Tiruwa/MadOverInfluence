<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />

    <meta name="description" content="MOI is a creator-first talent management and influencer marketing agency built to scale long-term creator careers and secure premium brand partnerships." />
    <meta name="keywords" content="Influencer Marketing, Creator Management, Brand Partnerships, Talent Agency, MadeOverInfluence, MOI" />
    <meta name="author" content="MadeOverInfluence" />
    <meta name="theme-color" content="#050505" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://madeoverinfluence.com https://api.resend.com;" />
    <link rel="canonical" href="https://madeoverinfluence.com/" />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://madeoverinfluence.com/" />
    <meta property="og:title" content="MadeOverInfluence (MOI) — Empowering Creators, Elevating Brands" />
    <meta property="og:description" content="MOI is a creator-first talent management and influencer marketing agency built to scale long-term creator careers and secure premium brand partnerships." />
    <meta property="og:image" content="https://madeoverinfluence.com/moi-logo-transparent.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://madeoverinfluence.com/" />
    <meta name="twitter:title" content="MadeOverInfluence (MOI) — Empowering Creators, Elevating Brands" />
    <meta name="twitter:description" content="MOI is a creator-first talent management and influencer marketing agency built to scale long-term creator careers and secure premium brand partnerships." />
    <meta name="twitter:image" content="https://madeoverinfluence.com/moi-logo-transparent.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/moi-logo-transparent.png" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <style>
      body {
        background-color: #050505;
        margin: 0;
      }
      .static-loader-container {
        position: fixed;
        inset: 0;
        background-color: #050505;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: sans-serif;
      }
      .static-loader-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 32rem;
        padding: 0 2rem;
      }
      .static-loader-logo {
        height: 2.5rem;
        margin-bottom: 2.5rem;
        opacity: 0.9;
      }
      @media (min-width: 640px) { .static-loader-logo { height: 3rem; margin-bottom: 3rem; } }
      @media (min-width: 768px) { .static-loader-logo { height: 3.5rem; margin-bottom: 4rem; } }
      .static-progress-track {
        width: 100%;
        height: 1px;
        background-color: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
        border-radius: 9999px;
        margin-bottom: 1.5rem;
      }
      .static-progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0%;
        background: linear-gradient(to right, #0066FF, #FF0099);
        border-radius: 9999px;
        animation: initial-progress 5s cubic-bezier(0.1, 0.7, 1, 0.1) forwards;
      }
      @keyframes initial-progress {
        0% { width: 0%; }
        100% { width: 40%; }
      }
      .static-text-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        width: 100%;
      }
      .static-loading-text {
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.75rem;
        line-height: 1rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-weight: 500;
        font-family: sans-serif;
      }
      .static-percent {
        color: white;
        font-size: 2.25rem;
        line-height: 2.5rem;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }
      .static-percent span {
        color: #0066FF;
      }
      .static-bottom-text {
        margin-top: 3rem;
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.75rem;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        font-family: sans-serif;
      }
    </style>
    <div id="static-loader" class="static-loader-container">
      <div class="static-loader-content">
        <img src="/moi-logo-transparent.png" alt="MOI" class="static-loader-logo" />
        <div class="static-progress-track">
          <div class="static-progress-fill"></div>
        </div>
        <div class="static-text-row">
          <span class="static-loading-text">Loading</span>
          <span class="static-percent">0<span>%</span></span>
        </div>
        <p class="static-bottom-text">MadeOverInfluence</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
